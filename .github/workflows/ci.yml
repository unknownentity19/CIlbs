name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Audit production dependencies
        # Dev-only advisories (drizzle-kit's bundled esbuild) are noise here;
        # what ships is what matters.
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://cilbs.com

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest

    # A real Postgres, so the gated half of the suite — the editor, which is
    # behind sign-in, and the account flow — actually runs in CI instead of
    # being skipped.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cilbs
          POSTGRES_PASSWORD: cilbs
          POSTGRES_DB: cilbs
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://cilbs:cilbs@127.0.0.1:5432/cilbs
      AUTH_SECRET: ci-session-secret-not-used-outside-continuous-integration
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Apply migrations
        run: npm run db:migrate

      - name: Run end-to-end tests
        # Playwright builds and starts the app itself (see playwright.config.ts).
        run: npm run test:e2e
        env:
          E2E_WITH_DB: "1"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
